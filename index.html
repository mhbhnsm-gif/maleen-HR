<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>شركة مالين الزرقاء</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-org-chart@1.0.0/dist/chartjs-plugin-org-chart.min.js"></script>
  <style>
    :root {
      --bg: #f8f9fc; --card: #ffffff; --primary: #4361ee; --accent: #3f37c9;
      --success: #06d6a0; --warning: #ffd166; --danger: #ef476f; --text: #2b2d42;
      --light: #edf2f4; --border: #dee2e6;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Tajawal', sans-serif; background: linear-gradient(135deg, #e0f7fa, #f0f4f8); color: var(--text); min-height: 100vh; padding: 15px; font-size: 14px; }
    .container { max-width: 100%; margin: 0 auto; background: var(--card); border-radius: 16px; padding: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); border: 1px solid var(--border); }

    h1 { text-align: center; color: var(--primary); margin-bottom: 18px; font-size: 1.6rem; font-weight: 900; }

    /* Tabs */
    .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 20px; overflow-x: auto; flex-wrap: nowrap; }
    .tab { padding: 12px 18px; background: var(--light); color: var(--text); cursor: pointer; font-weight: bold; white-space: nowrap; border-radius: 12px 12px 0 0; margin: 0 4px; transition: 0.3s; font-size: 0.9rem; }
    .tab.active { background: var(--primary); color: white; }
    .tab:hover:not(.active) { background: #d0e3ff; }

    /* Tab Content */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Controls */
    .controls { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    .search-box { position: relative; display: flex; align-items: center; }
    .search-box input { width: 100%; padding: 12px 40px 12px 16px; border: 1px solid var(--border); border-radius: 12px; font-family: inherit; font-size: 0.95rem; background: var(--light); color: var(--text); }
    .search-box i { position: absolute; left: 12px; color: var(--primary); font-size: 1.1rem; }
    select { padding: 12px 16px; border: none; border-radius: 12px; font-family: inherit; font-size: 0.95rem; cursor: pointer; font-weight: bold; background: var(--light); color: var(--text); border: 1px solid var(--border); }

    /* Stats Grid */
    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 20px 0; }
    .stat-card { background: var(--light); padding: 14px; border-radius: 12px; text-align: center; border: 1px solid var(--border); }
    .stat-card h3 { font-size: 0.8rem; color: #8d99ae; margin-bottom: 6px; }
    .stat-card p { font-size: 1.3rem; font-weight: bold; color: var(--success); }

    /* Employees Grid */
    .employees-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 16px; }
    .employee-card { background: var(--card); border-radius: 14px; padding: 16px; border: 1px solid var(--border); position: relative; box-shadow: 0 3px 10px rgba(0,0,0,0.06); }
    .employee-card h3 { color: var(--primary); margin-bottom: 8px; font-size: 1.15rem; font-weight: 700; }
    .total-salary { font-size: 1.1rem; color: var(--success); font-weight: bold; margin: 8px 0; }
    .roles-list { margin-top: 10px; }
    .role-group { background: var(--light); padding: 10px; border-radius: 10px; margin: 6px 0; border: 1px solid var(--border); }
    .role-group-title { font-weight: bold; color: var(--accent); margin-bottom: 6px; font-size: 0.85rem; }
    .role-item { padding: 6px 10px; margin: 3px 0; font-size: 0.82rem; display: flex; justify-content: space-between; align-items: center; background: white; border-radius: 6px; border: 1px solid var(--border); }
    .branch-tag { position: absolute; top: 8px; left: 8px; background: var(--success); color: white; padding: 3px 10px; border-radius: 16px; font-size: 0.7rem; font-weight: bold; }
    .edit-btn { background: var(--primary); color: white; padding: 8px 12px; font-size: 0.85rem; margin-top: 12px; width: 100%; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
    .edit-btn:hover { background: var(--accent); }

    /* Charts */
    .charts-grid { display: grid; gap: 20px; margin-top: 20px; }
    .chart-container { background: var(--light); padding: 16px; border-radius: 14px; border: 1px solid var(--border); }
    .chart-title { text-align: center; font-weight: bold; color: var(--primary); margin-bottom: 10px; font-size: 1.1rem; }
    canvas { max-height: 300px; }

    /* Org Chart */
    .org-container { background: var(--light); padding: 20px; border-radius: 14px; border: 1px solid var(--border); margin-top: 20px; overflow-x: auto; }
    .org-title { text-align: center; color: var(--primary); margin-bottom: 15px; font-weight: bold; }

    /* Stats Employees List */
    .stats-employees-list { margin-top: 20px; }
    .stats-employees-list h3 { color: var(--primary); margin-bottom: 12px; font-size: 1.2rem; text-align: center; }
    .stats-employee-item { background: white; padding: 12px; border-radius: 10px; margin: 8px 0; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; font-size: 0.9rem; }
    .stats-employee-item .name { font-weight: bold; color: var(--primary); }
    .stats-employee-item .details { display: flex; justify-content: space-between; color: #555; }

    /* Auth & Edit */
    .auth-overlay, .edit-form { display: none; background: rgba(0,0,0,0.7); position: fixed; top: 0; left: 0; right: 0; bottom: 0; align-items: center; justify-content: center; z-index: 1000; padding: 15px; }
    .auth-box, .edit-box { background: var(--card); padding: 24px; border-radius: 16px; width: 100%; max-width: 380px; box-shadow: 0 12px 30px rgba(0,0,0,0.2); text-align: center; border: 1px solid var(--border); }
    .auth-box h2, .edit-box h2 { color: var(--primary); margin-bottom: 16px; font-size: 1.3rem; }
    .auth-box input, .edit-box input, .edit-box select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 0.95rem; }
    .auth-actions, .edit-actions { display: flex; gap: 10px; margin-top: 16px; }
    .auth-actions button, .edit-actions button { flex: 1; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; font-size: 0.9rem; }
    .btn-success { background: var(--success); }
    .btn-danger { background: var(--danger); }

    @media (min-width: 480px) {
      .stats-grid { grid-template-columns: repeat(4, 1fr); }
      .employees-grid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
      .charts-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>

        <option value="مالين الصحي">مالين الصحي</option>
        <option value="الصيانة والتشغيل">الصيانة والتشغيل</option>
      </select>
    </div>

    <div class="org-container">
      <div class="org-title">الهيكل التنظيمي</div>
      <canvas id="orgChart"></canvas>
    </div>
  </div>
</div>

  let currentEditIndex = null;
  let charts = {};

  // === Tabs ===
  function openTab(tabName) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.querySelector(`.tab[onclick="openTab('${tabName}')"]`).classList.add('active');
    document.getElementById(tabName).classList.add('active');
    if (tabName === 'stats') updateCharts();
    if (tabName === 'org') updateOrgChart();
  }

  // === دمج للعرض ===
  function getMerged() {
    const merged = [];
    const seen = {};
    rawEmployees.forEach((emp, i) => {
      if (!seen[emp.name]) {
        seen[emp.name] = true;
        merged.push({ name: emp.name, roles: [emp], totalSalary: emp.salary, originalIndices: [i] });
      } else {
        const existing = merged.find(e => e.name === emp.name);
        existing.roles.push(emp);
        existing.totalSalary += emp.salary;
        existing.originalIndices.push(i);
      }
    });
    return merged;
  }

  // === عرض البطاقات ===
  function renderCards() {
    const searchTerm = document.getElementById("searchInput").value.trim().toLowerCase();
    const branchFilter = document.getElementById("branchFilter").value;
    const grid = document.getElementById("employeesGrid");
    grid.innerHTML = "";

    const merged = getMerged();
    const filtered = merged.filter(emp => {
      const matchesName = emp.name.toLowerCase().includes(searchTerm);
      const matchesBranch = branchFilter === "all" || emp.roles.some(r => r.branch === branchFilter);
      return matchesName && matchesBranch;
    });

    if (filtered.length === 0) {
      grid.innerHTML = `<p style="text-align:center; color:#8d99ae; padding:20px;">لا يوجد موظف يطابق البحث</p>`;
      renderStats(branchFilter);
      return;
    }

    filtered.forEach(emp => {
      const card = document.createElement("div");
      card.className = "employee-card";

      let groupsHTML = '';
      const visibleRoles = branchFilter === "all" ? emp.roles : emp.roles.filter(r => r.branch === branchFilter);
      const grouped = {};
      visibleRoles.forEach(r => {
        const key = `${r.section} - ${r.position}`;
        if (!grouped[key]) grouped[key] = [];
        grouped[key].push(r);
      });

      Object.keys(grouped).forEach(key => {
        const [sec, pos] = key.split(' - ');
        groupsHTML += `
          <div class="role-group">
            <div class="role-group-title">${sec} → ${pos}</div>
            ${grouped[key].map(r => `
              <div class="role-item">
                <span>${r.contract}</span>
                <strong>${r.salary} ر.س</strong>
              </div>
            `).join('')}
          </div>
        `;
      });

      const tag = visibleRoles.length === 1 ? visibleRoles[0].branch.split(" ").slice(0,2).join(" ") : "متعددة";

      card.innerHTML = `
        <div class="branch-tag">${tag}</div>
        <h3>${emp.name}</h3>
        <div class="total-salary">إجمالي: ${emp.totalSalary.toLocaleString()} ر.س</div>
        <div class="roles-list">${groupsHTML}</div>
        <button class="edit-btn" onclick="openAuthForEmployee('${emp.name}')">تعديل</button>
      `;
      grid.appendChild(card);
    });

    renderStats(branchFilter);
  }

  function renderStats(filter) {
    const data = filter === "all" ? rawEmployees : rawEmployees.filter(e => e.branch === filter);
    const total = data.length;
    const totalSalary = data.reduce((a,b) => a + b.salary, 0);
    const avg = total ? Math.round(totalSalary / total) : 0;
    const max = total ? Math.max(...data.map(e => e.salary)) : 0;

    document.getElementById("statsGrid").innerHTML = `
      <div class="stat-card"><h3>الموظفين</h3><p>${total}</p></div>
      <div class="stat-card"><h3>إجمالي الراتب</h3><p>${totalSalary.toLocaleString()}</p></div>
      <div class="stat-card"><h3>المتوسط</h3><p>${avg}</p></div>
      <div class="stat-card"><h3>الأعلى</h3><p>${max}</p></div>
    `;
  }

  // === التعديل ===
  function openAuthForEmployee(name) {
    const merged = getMerged();
    const emp = merged.find(e => e.name === name);
    if (!emp) return;

    const select = document.getElementById("roleSelect");
    select.innerHTML = "";
    emp.roles.forEach((role, i) => {
      const opt = document.createElement("option");
      opt.value = emp.originalIndices[i];
      opt.textContent = `${role.branch} - ${role.section} - ${role.position}`;
      select.appendChild(opt);
    });

    select.onchange = () => {
      const idx = select.value;
      const role = rawEmployees[idx];
      document.getElementById("editName").value = role.name;
      document.getElementById("editBranch").value = role.branch;
      document.getElementById("editBranch").value = role.section;
      document.getElementById("editPosition").value = role.position;
      document.getElementById("editSalary").value = role.salary;
      document.getElementById("editContract").value = role.contract;
      currentEditIndex = idx;
    };
    select.onchange();

    document.getElementById("authOverlay").style.display = "flex";
  }

  function verifyCode() {
    if (document.getElementById("authCode").value === "1999") {
      closeAuth();
      document.getElementById("editForm").style.display = "flex";
    } else {
      alert("رمز غير صحيح!");
    }
  }

  function saveEdit() {
    const idx = currentEditIndex;
    const emp = rawEmployees[idx];
    emp.name = document.getElementById("editName").value;
    emp.branch = document.getElementById("editBranch").value;
    emp.section = document.getElementById("editSection").value;
    emp.position = document.getElementById("editPosition").value;
    emp.salary = parseInt(document.getElementById("editSalary").value) || 0;
    emp.contract = document.getElementById("editContract").value;

    closeEdit();
    renderCards();
    updateCharts();
    updateOrgChart();
    alert("تم الحفظ!");
  }

  function closeAuth() { document.getElementById("authOverlay").style.display = "none"; document.getElementById("authCode").value = ""; }
  function closeEdit() { document.getElementById("editForm").style.display = "none"; }

  // === الإحصائيات ===
  function updateCharts() {
    const filter = document.getElementById("statsBranchFilter").value;
    const data = filter === "all" ? rawEmployees : rawEmployees.filter(e => e.branch === filter);

    const branchCount = {};
    rawEmployees.forEach(e => branchCount[e.branch] = (branchCount[e.branch] || 0) + 1);
    updateChart('branchChart', 'bar', Object.keys(branchCount), Object.values(branchCount), 'عدد الموظفين', '#4361ee');

    const sectionCount = {};
    data.forEach(e => sectionCount[e.section] = (sectionCount[e.section] || 0) + 1);
    updateChart('sectionChart', 'pie', Object.keys(sectionCount), Object.values(sectionCount), null, ['#06d6a0', '#ffd166', '#ef476f', '#4361ee', '#3f37c9']);

    const salaryRanges = { 'أقل من 3000': 0, '3000-5000': 0, '5000-8000': 0, 'أكثر من 8000': 0 };
    data.forEach(e => {
      if (e.salary < 3000) salaryRanges['أقل من 3000']++;
      else if (e.salary <= 5000) salaryRanges['3000-5000']++;
      else if (e.salary <= 8000) salaryRanges['5000-8000']++;
      else salaryRanges['أكثر من 8000']++;
    });
    updateChart('salaryChart', 'doughnut', Object.keys(salaryRanges), Object.values(salaryRanges), null, ['#ef476f', '#ffd166', '#06d6a0', '#4361ee']);

    const totalByBranch = {};
    rawEmployees.forEach(e => totalByBranch[e.branch] = (totalByBranch[e.branch] || 0) + e.salary);
    updateChart('totalSalaryChart', 'bar', Object.keys(totalByBranch), Object.values(totalByBranch), 'إجمالي الراتب (ر.س)', '#06d6a0');

    const container = document.getElementById("statsEmployeesContainer");
    container.innerHTML = "";
    if (filter === "all") {
      container.innerHTML = `<p style="text-align:center; color:#8d99ae;">اختر فرعًا لرؤية الموظفين</p>`;
    } else {
      const branchEmployees = rawEmployees.filter(e => e.branch === filter);
      if (branchEmployees.length === 0) {
        container.innerHTML = `<p style="text-align:center; color:#8d99ae;">لا يوجد موظفون</p>`;
      } else {
        branchEmployees.forEach(emp => {
          const item = document.createElement("div");
          item.className = "stats-employee-item";
          item.innerHTML = `
            <div class="name">${emp.name}</div>
            <div class="details">
              <span>${emp.section} - ${emp.position}</span>
              <span><strong>${emp.salary} ر.س</strong> (${emp.contract})</span>
            </div>
          `;
          container.appendChild(item);
        });
      }
    }
  }

  // === الهيكل التنظيمي ===
  function updateOrgChart() {
    const filter = document.getElementById("orgBranchFilter").value;
    const data = filter === "all" ? rawEmployees : rawEmployees.filter(e => e.branch === filter);

    // بناء الهيكل
    const root = { name: filter === "all" ? "مالين الزرقاء" : filter, children: [] };
    const sections = {};
    data.forEach(emp => {
      if (!sections[emp.section]) {
        sections[emp.section] = { name: emp.section, children: [] };
        root.children.push(sections[emp.section]);
      }
      sections[emp.section].children.push({
        name: `${emp.name} (${emp.position})`,
        title: `${emp.salary} ر.س`
      });
    });

    if (charts.orgChart) charts.orgChart.destroy();
    charts.orgChart = new Chart(document.getElementById('orgChart'), {
      type: 'org',
      data: { datasets: [{ tree: [root] }] },
      options: {
        responsive: true,
        plugins: { legend: { display: false } }
      }
    });
  }

  function updateChart(id, type, labels, data, label, colors) {
    if (charts[id]) charts[id].destroy();
    const config = {
      type,
      data: { labels, datasets: [{ label, data, backgroundColor: colors || '#4361ee' }] },
      options: { responsive: true, plugins: { legend: { display: type !== 'bar' } } }
    };
    charts[id] = new Chart(document.getElementById(id), config);
  }

  // === الأحداث ===
  document.getElementById("searchInput").addEventListener("input", renderCards);
  document.getElementById("branchFilter").addEventListener("change", renderCards);
  document.getElementById("statsBranchFilter").addEventListener("change", updateCharts);
  document.getElementById("orgBranchFilter").addEventListener("change", updateOrgChart);

  // === بدء التشغيل ===
  renderCards();
</script>

</body>
</html>
