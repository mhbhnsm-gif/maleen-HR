<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>شركة مالين الزرقاء</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-org-chart@1.0.0/dist/chartjs-plugin-org-chart.min.js"></script>
  <style>
    :root {
      --bg: #f8f9fc; --card: #ffffff; --primary: #4361ee; --accent: #3f37c9;
      --success: #06d6a0; --warning: #ffd166; --danger: #ef476f; --text: #2b2d42;
      --light: #edf2f4; --border: #dee2e6;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Tajawal', sans-serif; background: linear-gradient(135deg, #e0f7fa, #f0f4f8); color: var(--text); min-height: 100vh; padding: 15px; font-size: 14px; }
    .container { max-width: 100%; margin: 0 auto; background: var(--card); border-radius: 16px; padding: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); border: 1px solid var(--border); }
    h1 { text-align: center; color: var(--primary); margin-bottom: 18px; font-size: 1.6rem; font-weight: 900; }

    .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 20px; overflow-x: auto; flex-wrap: nowrap; }
    .tab { padding: 12px 18px; background: var(--light); color: var(--text); cursor: pointer; font-weight: bold; white-space: nowrap; border-radius: 12px 12px 0 0; margin: 0 4px; transition: 0.3s; font-size: 0.9rem; }
    .tab.active { background: var(--primary); color: white; }
    .tab:hover:not(.active) { background: #d0e3ff; }

    .controls { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    .search-box { position: relative; }
    .search-box input { width: 100%; padding: 12px 40px 12px 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--light); font-family: inherit; font-size: 0.95rem; }
    .search-box i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--primary); }
    select { padding: 12px 16px; border-radius: 12px; background: var(--light); border: 1px solid var(--border); font-weight: bold; font-family: inherit; font-size: 0.95rem; cursor: pointer; }

    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 20px 0; }
    .stat-card { background: var(--light); padding: 14px; border-radius: 12px; text-align: center; border: 1px solid var(--border); }
    .stat-card h3 { font-size: 0.8rem; color: #8d99ae; margin-bottom: 6px; }
    .stat-card p { font-size: 1.3rem; font-weight: bold; color: var(--success); }

    .employees-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 16px; }
    .employee-card { background: var(--card); border-radius: 14px; padding: 16px; border: 1px solid var(--border); position: relative; box-shadow: 0 3px 10px rgba(0,0,0,0.06); }
    .employee-card h3 { color: var(--primary); margin-bottom: 8px; font-size: 1.15rem; font-weight: 700; }
    .total-salary { font-size: 1.1rem; color: var(--success); font-weight: bold; margin: 8px 0; }
    .roles-list { margin-top: 10px; }
    .role-group { background: var(--light); padding: 10px; border-radius: 10px; margin: 6px 0; border: 1px solid var(--border); }
    .role-group-title { font-weight: bold; color: var(--accent); margin-bottom: 6px; font-size: 0.85rem; }
    .role-item { padding: 6px 10px; margin: 3px 0; font-size: 0.82rem; display: flex; justify-content: space-between; background: white; border-radius: 6px; border: 1px solid var(--border); }
    .branch-tag { position: absolute; top: 8px; left: 8px; background: var(--success); color: white; padding: 3px 10px; border-radius: 16px; font-size: 0.7rem; font-weight: bold; }
    .edit-btn { background: var(--primary); color: white; padding: 8px 12px; font-size: 0.85rem; margin-top: 12px; width: 100%; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
    .edit-btn:hover { background: var(--accent); }

    .charts-grid { display: grid; gap: 20px; margin-top: 20px; }
    .chart-container { background: var(--light); padding: 16px; border-radius: 14px; border: 1px solid var(--border); }
    .chart-title { text-align: center; font-weight: bold; color: var(--primary); margin-bottom: 10px; font-size: 1.1rem; }
    canvas { max-height: 300px; }

    .stats-employees-list { margin-top: 20px; }
    .stats-employees-list h3 { color: var(--primary); margin-bottom: 12px; font-size: 1.2rem; text-align: center; }
    .stats-employee-item { background: white; padding: 12px; border-radius: 10px; margin: 8px 0; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; font-size: 0.9rem; }
    .stats-employee-item .name { font-weight: bold; color: var(--primary); }
    .stats-employee-item .details { display: flex; justify-content: space-between; color: #555; }

    .org-container { background: var(--light); padding: 20px; border-radius: 14px; border: 1px solid var(--border); margin-top: 20px; overflow: auto; min-height: 500px; }
    .org-title { text-align: center; color: var(--primary); margin-bottom: 15px; font-weight: bold; font-size: 1.3rem; }

    .auth-overlay, .edit-form { display: none; background: rgba(0,0,0,0.7); position: fixed; top: 0; left: 0; right: 0; bottom: 0; align-items: center; justify-content: center; z-index: 1000; padding: 15px; }
    .auth-box, .edit-box { background: var(--card); padding: 24px; border-radius: 16px; width: 100%; max-width: 380px; box-shadow: 0 12px 30px rgba(0,0,0,0.2); text-align: center; border: 1px solid var(--border); }
    .auth-box h2, .edit-box h2 { color: var(--primary); margin-bottom: 16px; font-size: 1.3rem; }
    .auth-box input, .edit-box input, .edit-box select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 0.95rem; }
    .auth-actions, .edit-actions { display: flex; gap: 10px; margin-top: 16px; }
    .auth-actions button, .edit-actions button { flex: 1; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; font-size: 0.9rem; }
    .btn-success { background: var(--success); }
    .btn-danger { background: var(--danger); }

    @media (min-width: 480px) {
      .stats-grid { grid-template-columns: repeat(4, 1fr); }
      .employees-grid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
      .charts-grid { grid-template-columns: 1fr 1fr; }
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body>

<div class="container">
  <h1>شركة مالين الزرقاء</h1>

  <div class="tabs">
    <div class="tab active" onclick="openTab('employees')">الموظفين</div>
    <div class="tab" onclick="openTab('stats')">الإحصائيات</div>
    <div class="tab" onclick="openTab('org')">الهيكل التنظيمي</div>
  </div>

  <!-- تبويب الموظفين -->
  <div id="employees" class="tab-content active">
    <div class="controls">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="ابحث بالاسم..." oninput="renderCards()" />
      </div>
      <select id="branchFilter" onchange="updateSectionFilter('branchFilter', 'sectionFilter'); renderCards();">
        <option value="all">جميع الفروع</option>
        <option value="الزرقاء اشبيليا">الزرقاء اشبيليا</option>
        <option value="الفرع الالكتروني">الفرع الالكتروني</option>
        <option value="مالين الصحي">مالين الصحي</option>
        <option value="الصيانة والتشغيل">الصيانة والتشغيل</option>
      </select>
      <select id="sectionFilter" onchange="renderCards();" style="display:none;">
        <option value="all">جميع الأقسام</option>
      </select>
    </div>

    <!-- بطاقات الإحصاء -->
    <div class="stats-grid" id="employeesStatsGrid"></div>

    <div class="employees-grid" id="employeesGrid"></div>
  </div>

  <!-- تبويب الإحصائيات -->
  <div id="stats" class="tab-content">
    <div class="charts-grid">
      <div class="chart-container">
        <div class="chart-title">توزيع الموظفين حسب الفرع</div>
        <canvas id="branchChart"></canvas>
      </div>
      <div class="chart-container">
        <div class="chart-title">توزيع الرواتب حسب القسم</div>
        <canvas id="sectionSalaryChart"></canvas>
      </div>
    </div>

    <div class="stats-employees-list">
      <h3>أعلى 5 رواتب</h3>
      <div id="topSalaries"></div>
      <h3>أقل 5 رواتب</h3>
      <div id="lowestSalaries"></div>
    </div>
  </div>

  <!-- تبويب الهيكل التنظيمي -->
  <div id="org" class="tab-content">
    <div class="org-container">
      <div class="org-title">الهيكل التنظيمي</div>
      <canvas id="orgChart"></canvas>
    </div>
  </div>
</div>

<!-- نموذج المصادقة -->
<div class="auth-overlay" id="authOverlay">
  <div class="auth-box">
    <h2>تأكيد الهوية</h2>
    <input type="password" id="authPassword" placeholder="كلمة المرور" />
    <div class="auth-actions">
      <button class="btn-success" onclick="verifyAuth()">تأكيد</button>
      <button class="btn-danger" onclick="closeAuth()">إلغاء</button>
    </div>
  </div>
</div>

<!-- نموذج التعديل -->
<div class="edit-form" id="editForm">
  <div class="edit-box">
    <h2>تعديل الموظف</h2>
    <input type="text" id="editName" placeholder="الاسم" />
    <input type="number" id="editSalary" placeholder="الراتب" />
    <select id="editContract">
      <option value="أساسي">أساسي</option>
      <option value="متعاون كامل">متعاون كامل</option>
      <option value="متعاون جزئي">متعاون جزئي</option>
    </select>
    <div class="edit-actions">
      <button class="btn-success" onclick="saveEdit()">حفظ</button>
      <button class="btn-danger" onclick="closeEdit()">إلغاء</button>
    </div>
  </div>
</div>

    { name: "يحيى زيدان", branch: "الزرقاء اشبيليا", section: "انجليزي الرجالي", position: "مدرب", salary: 3800, contract: "متعاون جزئي" },
    { name: "عبدالله الاجرد", branch: "الزرقاء اشبيليا", section: "الإدارة", position: "مشرف قسم اللغات", salary: 2500, contract: "متعاون جزئي" },

    { name: "سارة السودانية", branch: "الزرقاء اشبيليا", section: "انجليزي النسائي", position: "مدرب", salary: 8500, contract: "أساسي" },
    { name: "شروق", branch: "الزرقاء اشبيليا", section: "الحاسب النسائي", position: "مدرب", salary: 3500, contract: "متعاون جزئي" },

    { name: "ايهاب خليفة", branch: "الفرع الالكتروني", section: "الدبلومات المهنية", position: "مدرب", salary: 3600, contract: "متعاون جزئي" },

    { name: "الهنوف الفريح", branch: "الفرع الالكتروني", section: "الإدارة", position: "مشرف اللغة الصينية", salary: 4500, contract: "متعاون جزئي" },

    { name: "محمد إبراهيم المسلمي", branch: "مالين الصحي", section: "الإدارة", position: "منسق اكاديمي", salary: 8000, contract: "أساسي" },
    { name: "عبدالله الخطيب", branch: "مالين الصحي", section: "الإدارة", position: "مسؤول التسويق", salary: 4500, contract: "أساسي" },
    { name: "ماجد الغامدي", branch: "الزرقاء اشبيليا", section: "حماية الأجور", position: "موظف", salary: 2000, contract: "أساسي" },
    { name: "عبدالله خالد عطيه", branch: "الزرقاء اشبيليا", section: "حماية الأجور", position: "موظف", salary: 2000, contract: "أساسي" },
    { name: "تركي مصلح الغامدي", branch: "الزرقاء اشبيليا", section: "حماية الأجور", position: "موظف", salary: 2000, contract: "أساسي" },

    { name: "عبد الملك", branch: "الصيانة والتشغيل", section: "الصيانة والتشغيل", position: "عامل", salary: 2200, contract: "أساسي" },
    { name: "جنان", branch: "الصيانة والتشغيل", section: "حماية الأجور", position: "موظف", salary: 2000, contract: "أساسي" },
    { name: "حمزة", branch: "الصيانة والتشغيل", section: "حماية الأجور", position: "موظف", salary: 2000, contract: "أساسي" },
    { name: "سيف", branch: "الفرع الالكتروني", section: "الدبلومات المهنية", position: "مدرب", salary: 5300, contract: "أساسي" },
    { name: "هوازن", branch: "الفرع الالكتروني", section: "حماية الأجور", position: "موظف", salary: 2000, contract: "أساسي" },
    { name: "بغدادي", branch: "الصيانة والتشغيل", section: "الصيانة والتشغيل", position: "عامل", salary: 3000, contract: "أساسي" },
    { name: "هناء", branch: "الصيانة والتشغيل", section: "حماية الأجور", position: "موظف", salary: 2000, contract: "أساسي" },
    { name: "فاطمة الصينية", branch: "الفرع الالكتروني", section: "اللغات - انجليزي", position: "مدرب", salary: 6000, contract: "متعاون جزئي" }
  ];

  let currentEditEmployee = null;
  let authTarget = null;

  // === دالة دمج الموظفين ===
  function getMerged() {
    const map = {};
    rawEmployees.forEach(emp => {
      if (!map[emp.name]) {
        map[emp.name] = { name: emp.name, roles: [], totalSalary: 0 };
      }
      map[emp.name].roles.push(emp);
      map[emp.name].totalSalary += emp.salary;
    });
    return Object.values(map);
  }

  // === تحديث فلتر الأقسام ===
  function updateSectionFilter(branchId, sectionId) {
    const branch = document.getElementById(branchId).value;
    const sectionSelect = document.getElementById(sectionId);
    sectionSelect.style.display = branch === "all" ? "none" : "block";
    sectionSelect.innerHTML = '<option value="all">جميع الأقسام</option>';

    if (branch !== "all") {
      const sections = [...new Set(rawEmployees.filter(e => e.branch === branch).map(e => e.section))];
      sections.forEach(sec => {
        const opt = document.createElement("option");
        opt.value = sec;
        opt.textContent = sec;
        sectionSelect.appendChild(opt);
      });
    }
  }

  // === عرض بطاقات الموظفين + الإحصائيات ===
  function renderCards() {
    const searchTerm = document.getElementById("searchInput").value.trim().toLowerCase();
    const branchFilter = document.getElementById("branchFilter").value;
    const sectionFilter = document.getElementById("sectionFilter").value;
    const grid = document.getElementById("employeesGrid");
    const statsGrid = document.getElementById("employeesStatsGrid");
    grid.innerHTML = "";
    statsGrid.innerHTML = "";

    const filteredRaw = rawEmployees.filter(emp => {
      const matchesBranch = branchFilter === "all" || emp.branch === branchFilter;
      const matchesSection = sectionFilter === "all" || emp.section === sectionFilter;
      const matchesName = emp.name.toLowerCase().includes(searchTerm);
      return matchesBranch && matchesSection && matchesName;
    });

    // === حساب الإحصائيات ===
    const totalEmployees = filteredRaw.length;
    const totalSalary = filteredRaw.reduce((a, b) => a + b.salary, 0);
    const basicCount = filteredRaw.filter(e => e.contract === "أساسي").length;
    const collaboratorCount = totalEmployees - basicCount;

    // === عرض الإحصائيات ===
    statsGrid.innerHTML = `
      <div class="stat-card"><h3>الموظفين</h3><p>${totalEmployees}</p></div>
      <div class="stat-card"><h3>إجمالي الرواتب</h3><p>${totalSalary.toLocaleString()} ر.س</p></div>
      <div class="stat-card"><h3>عدد الأساسي</h3><p style="color:#06d6a0;">${basicCount}</p></div>
      <div class="stat-card"><h3>عدد المتعاون</h3><p style="color:#ffd166;">${collaboratorCount}</p></div>
    `;

    const merged = getMerged();
    const filteredMerged = merged.filter(emp => {
      return emp.roles.some(r => filteredRaw.some(fr => fr === r));
    });

    if (filteredMerged.length === 0) {
      grid.innerHTML = `<p style="text-align:center; color:#8d99ae; padding:20px;">لا يوجد موظف يطابق البحث</p>`;
      return;
    }

    filteredMerged.forEach(emp => {
      const card = document.createElement("div");
      card.className = "employee-card";
      let groupsHTML = '';
      const visibleRoles = emp.roles.filter(r =>
        (branchFilter === "all" || r.branch === branchFilter) &&
        (sectionFilter === "all" || r.section === sectionFilter)
      );
      const grouped = {};
      visibleRoles.forEach(r => {
        const key = `${r.section} - ${r.position}`;
        if (!grouped[key]) grouped[key] = [];
        grouped[key].push(r);
      });

      Object.keys(grouped).forEach(key => {
        const [sec, pos] = key.split(' - ');
        groupsHTML += `
          <div class="role-group">
            <div class="role-group-title">${sec} → ${pos}</div>
            ${grouped[key].map(r => `
              <div class="role-item">
                <span>${r.contract}</span>
                <strong>${r.salary} ر.س</strong>
              </div>
            `).join('')}
          </div>
        `;
      });

      const tag = visibleRoles.length === 1 ? visibleRoles[0].branch.split(" ").slice(0,2).join(" ") : "متعددة";
      card.innerHTML = `
        <div class="branch-tag">${tag}</div>
        <h3>${emp.name}</h3>
        <div class="total-salary">إجمالي: ${emp.totalSalary.toLocaleString()} ر.س</div>
        <div class="roles-list">${groupsHTML}</div>
        <button class="edit-btn" onclick="openAuthForEmployee('${emp.name}')">تعديل</button>
      `;
      grid.appendChild(card);
    });
  }

  // === تبديل التبويبات ===
  function openTab(tabName) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById(tabName).classList.add('active');
    document.querySelector(`.tab[onclick="openTab('${tabName}')"]`).classList.add('active');

    if (tabName === 'stats') updateAllStats();
    if (tabName === 'org') updateOrgChart();
  }

  // === تحديث الإحصائيات ===
  function updateAllStats() {
    const branchData = {};
    const sectionSalaryData = {};

    rawEmployees.forEach(emp => {
      branchData[emp.branch] = (branchData[emp.branch] || 0) + 1;
      const key = `${emp.section} (${emp.branch})`;
      sectionSalaryData[key] = (sectionSalaryData[key] || 0) + emp.salary;
    });

    new Chart(document.getElementById('branchChart'), {
      type: 'doughnut',
      data: {
        labels: Object.keys(branchData),
        datasets: [{ data: Object.values(branchData), backgroundColor: ['#4361ee', '#06d6a0', '#ffd166', '#ef476f'] }]
      },
      options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
    });

    new Chart(document.getElementById('sectionSalaryChart'), {
      type: 'bar',
      data: {
        labels: Object.keys(sectionSalaryData),
        datasets: [{ label: 'إجمالي الرواتب', data: Object.values(sectionSalaryData), backgroundColor: '#4361ee' }]
      },
      options: { responsive: true, scales: { y: { beginAtZero: true } } }
    });

    const merged = getMerged();
    const sorted = merged.sort((a, b) => b.totalSalary - a.totalSalary);
    document.getElementById('topSalaries').innerHTML = sorted.slice(0, 5).map(e => `
      <div class="stats-employee-item">
        <div class="name">${e.name}</div>
        <div class="details"><span>${e.roles.length} دور</span><strong>${e.totalSalary.toLocaleString()} ر.س</strong></div>
      </div>
    `).join('');

    document.getElementById('lowestSalaries').innerHTML = sorted.slice(-5).reverse().map(e => `
      <div class="stats-employee-item">
        <div class="name">${e.name}</div>
        <div class="details"><span>${e.roles.length} دور</span><strong>${e.totalSalary.toLocaleString()} ر.س</strong></div>
      </div>
    `).join('');
  }

  // === تحديث الهيكل التنظيمي ===
  function updateOrgChart() {
    const data = {
      name: "شركة مالين الزرقاء",
      children: [
        { name: "الزرقاء اشبيليا", children: rawEmployees.filter(e => e.branch === "الزرقاء اشبيليا").map(e => ({ name: `${e.name} - ${e.position}` })) },
        { name: "الفرع الالكتروني", children: rawEmployees.filter(e => e.branch === "الفرع الالكتروني").map(e => ({ name: `${e.name} - ${e.position}` })) },
        { name: "مالين الصحي", children: rawEmployees.filter(e => e.branch === "مالين الصحي").map(e => ({ name: `${e.name} - ${e.position}` })) },
        { name: "الصيانة والتشغيل", children: rawEmployees.filter(e => e.branch === "الصيانة والتشغيل").map(e => ({ name: `${e.name} - ${e.position}` })) }
      ]
    };

    new Chart(document.getElementById('orgChart'), {
      type: 'orgchart',
      data: { datasets: [{ tree: [data] }] },
      options: { responsive: true }
    });
  }

  // === فتح المصادقة للتعديل ===
  function openAuthForEmployee(name) {
    authTarget = name;
    document.getElementById('authOverlay').style.display = 'flex';
  }

  function closeAuth() {
    document.getElementById('authOverlay').style.display = 'none';
    authTarget = null;
  }

  function verifyAuth() {
    const pass = document.getElementById('authPassword').value;
    if (pass === "1234") {
      closeAuth();
      openEditForm(authTarget);
    } else {
      alert("كلمة المرور غير صحيحة!");
    }
  }

  // === فتح نموذج التعديل ===
  function openEditForm(name) {
    currentEditEmployee = rawEmployees.find(e => e.name === name);
    if (!currentEditEmployee) return;

    document.getElementById('editName').value = currentEditEmployee.name;
    document.getElementById('editSalary').value = currentEditEmployee.salary;
    document.getElementById('editContract').value = currentEditEmployee.contract;
    document.getElementById('editForm').style.display = 'flex';
  }

  function closeEdit() {
    document.getElementById('editForm').style.display = 'none';
    currentEditEmployee = null;
  }

  function saveEdit() {
    if (!currentEditEmployee) return;

    const newName = document.getElementById('editName').value.trim();
    const newSalary = parseInt(document.getElementById('editSalary').value);
    const newContract = document.getElementById('editContract').value;

    if (!newName || isNaN(newSalary)) {
      alert("يرجى ملء جميع الحقول بشكل صحيح");
      return;
    }

    currentEditEmployee.name = newName;
    currentEditEmployee.salary = newSalary;
    currentEditEmployee.contract = newContract;

    closeEdit();
    renderCards();
    if (document.getElementById('stats').classList.contains('active')) updateAllStats();
    if (document.getElementById('org').classList.contains('active')) updateOrgChart();
  }

  // === تهيئة عند التحميل ===
  window.onload = function() {
    updateSectionFilter('branchFilter', 'sectionFilter');
    renderCards();
  };
</script>

</body>
</html>
