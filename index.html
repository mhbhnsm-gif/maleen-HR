<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>نظام موظفي شركة مالين الزرقاء</title>
  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      background: #f4f7fa;
      color: #333;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }
    h1 { color: #1e3c72; text-align: center; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; margin: 20px 0; }
    th, td { padding: 12px; text-align: center; border-bottom: 1px solid #ddd; }
    th { background: #1e3c72; color: white; }
    .search { padding: 10px; width: 300px; margin: 15px 0; border-radius: 8px; border: 1px solid #1e3c72; }
    button { background: #00d4ff; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; margin: 5px; }
    button:hover { background: #00a8cc; }
    .stats { display: flex; justify-content: space-around; margin: 20px 0; }
    .stat-box { background: #1e3c72; color: white; padding: 15px; border-radius: 10px; width: 22%; text-align: center; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
  <h1>نظام إدارة موظفي شركة مالين الزرقاء</h1>

  <input type="text" id="search" class="search" placeholder="ابحث بالاسم أو القسم..." onkeyup="searchTable()">

  <div class="stats">
    <div class="stat-box">إجمالي الموظفين: <span id="total">150</span></div>
    <div class="stat-box">الإنتاج: <span id="prod">80</span></div>
    <div class="stat-box">التسويق: <span id="market">25</span></div>
    <div class="stat-box">متوسط الراتب: <span id="avg">680</span> د.أ</div>
  </div>

  <button onclick="addEmployee()">إضافة موظف جديد</button>
  <button onclick="exportData()">تصدير كـ Excel</button>

  <table id="employeesTable">
    <thead>
      <tr>
        <th>الرقم</th>
        <th>الاسم</th>
        <th>القسم</th>
        <th>الراتب</th>
        <th>تاريخ التوظيف</th>
        <th>الإجراءات</th>
      </tr>
    </thead>
    <tbody>
      <!-- سيتم ملؤها ديناميكيًا -->
    </tbody>
  </table>
</div>

<script>
  // بيانات افتراضية
  let employees = [
    {id: 1, name: "أحمد محمد", dept: "الإنتاج", salary: 600, date: "2023-05-10"},
    {id: 2, name: "فاطمة علي", dept: "التسويق", salary: 750, date: "2024-01-15"},
    // ... يمكن إضافة المزيد
  ];

  function renderTable() {
    const tbody = document.querySelector("#employeesTable tbody");
    tbody.innerHTML = "";
    employees.forEach(emp => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${emp.id}</td>
        <td>${emp.name}</td>
        <td>${emp.dept}</td>
        <td>${emp.salary}</td>
        <td>${emp.date}</td>
        <td>
          <button onclick="editEmployee(${emp.id})">تعديل</button>
          <button onclick="deleteEmployee(${emp.id})" style="background:red;">حذف</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
    updateStats();
  }

  function updateStats() {
    document.getElementById("total").textContent = employees.length;
    document.getElementById("prod").textContent = employees.filter(e => e.dept === "الإنتاج").length;
    document.getElementById("market").textContent = employees.filter(e => e.dept === "التسويق").length;
    const avg = employees.reduce((a,b) => a + b.salary, 0) / employees.length || 0;
    document.getElementById("avg").textContent = Math.round(avg);
  }

  function searchTable() {
    const input = document.getElementById("search").value.toLowerCase();
    const rows = document.querySelectorAll("#employeesTable tbody tr");
    rows.forEach(row => {
      const text = row.textContent.toLowerCase();
      row.style.display = text.includes(input) ? "" : "none";
    });
  }

  function addEmployee() {
    const name = prompt("الاسم:");
    const dept = prompt("القسم:");
    const salary = parseInt(prompt("الراتب:"));
    const date = new Date().toISOString().split('T')[0];
    const id = employees.length ? Math.max(...employees.map(e=>e.id)) + 1 : 1;
    if (name && dept && salary) {
      employees.push({id, name, dept, salary, date});
      renderTable();
    }
  }

  function deleteEmployee(id) {
    if (confirm("هل تريد حذف هذا الموظف؟")) {
      employees = employees.filter(e => e.id !== id);
      renderTable();
    }
  }

  function editEmployee(id) {
    const emp = employees.find(e => e.id === id);
    const newName = prompt("تعديل الاسم:", emp.name);
    if (newName) emp.name = newName;
    renderTable();
  }

  function exportData() {
    alert("سيتم تصدير البيانات كملف Excel قريبًا!");
  }

  // تحميل الجدول عند بدء التشغيل
  renderTable();
</script>

</body>
</html>
